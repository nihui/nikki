<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <title>nikki WebGPU test</title>
</head>
<body>
<script type="module">
const parameters = new URLSearchParams(window.location.search);
const name = parameters.get("name");
const module_url = parameters.get("module");
const worker = new Worker("./webgpu_test_worker.mjs", { type: "module" });

let result_count = 0;
window.__nikkiWebGpuDone = new Promise((resolve, reject) => {
    worker.addEventListener("error", (event) => reject(event.error || new Error(event.message)));
    worker.addEventListener("messageerror", () => reject(new Error("Worker message deserialization failed")));
    worker.addEventListener("message", (event) => {
        if (event.data.type === "nikki-webgpu-log") {
            const method = event.data.stream === "stderr" ? "error" : "log";
            console[method](event.data.message);
            return;
        }
        if (event.data.type !== "nikki-webgpu-result") return;
        result_count++;
        if (result_count !== 1) {
            reject(new Error("Worker sent more than one WebGPU result"));
            return;
        }
        resolve(event.data.payload);
    });
});

worker.postMessage({
    type: "nikki-webgpu-run",
    name,
    module_url,
});
</script>
</body>
</html>
